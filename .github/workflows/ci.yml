name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system deps
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
          libjavascriptcoregtk-4.1-dev build-essential
      - run: cargo test --workspace --locked

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - run: npm ci
        working-directory: src-ui
      - run: npm test
        working-directory: src-ui
      - run: npm run build
        working-directory: src-ui

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src-ui/package-lock.json
            tests/e2e/package-lock.json
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-chromedriver: true
      - run: npm ci
        working-directory: src-ui
      - run: npm run build
        working-directory: src-ui
      - run: npm ci
        working-directory: tests/e2e
      - name: Run Selenium browser interactions
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          MUIS_URL: http://127.0.0.1:4173
          SHOTS_DIR: ${{ github.workspace }}/tests/e2e/artifacts/browser
        run: |
          python3 -m http.server 4173 --directory src-ui/dist > /tmp/muis-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS "$MUIS_URL/" >/dev/null && break
            sleep 1
          done
          npm test --prefix tests/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muis-browser-e2e
          path: tests/e2e/artifacts/browser/

  native-xvfb-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - name: Install Tauri and virtual-display dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
          libjavascriptcoregtk-4.1-dev build-essential
          xvfb xauth xdotool imagemagick
      - run: npm ci
        working-directory: src-ui
      - run: npm run build
        working-directory: src-ui
      - run: cargo build --locked -p muis-shell -p muis-worker
      - name: Run native Tauri PTY smoke under Xvfb
        run: bash tests/e2e/live-x11.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muis-native-xvfb
          path: tests/e2e/artifacts/live-x11/

  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - run: npm ci
        working-directory: src-ui
      - run: npm run build
        working-directory: src-ui
      - run: cargo build --release --locked -p muis-shell -p muis-worker
      - name: Assemble portable zip
        run: >
          Compress-Archive -Path
          target\release\muis.exe,target\release\muis-worker.exe
          -DestinationPath muis-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: muis-portable
          path: muis-portable.zip
