name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

jobs:
  # Build + test the frontend once; every later job reuses dist/ instead of
  # reinstalling and rebuilding it five times.
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - run: npm ci
        working-directory: src-ui
      - run: npm test
        working-directory: src-ui
      - run: npm run build
        working-directory: src-ui
      - uses: actions/upload-artifact@v6
        with:
          name: ui-dist
          path: src-ui/dist
          if-no-files-found: error

  # Rust workspace tests plus the native Tauri/WebKit PTY smoke, sharing one
  # cached build (previously two separate uncached Rust jobs).
  rust:
    needs: build-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-linux
      - uses: actions/download-artifact@v6
        with:
          name: ui-dist
          path: src-ui/dist
      - name: Install Tauri and virtual-display dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
          libjavascriptcoregtk-4.1-dev build-essential
          xvfb xauth imagemagick
      - run: cargo test --workspace --locked
      - run: cargo build --locked -p muis-shell -p muis-worker
      - name: Run native Tauri PTY smoke under Xvfb
        run: bash tests/e2e/live-x11.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: muis-native-xvfb
          path: tests/e2e/artifacts/live-x11/

  browser-e2e:
    needs: build-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-chromedriver: true
      - uses: actions/download-artifact@v6
        with:
          name: ui-dist
          path: src-ui/dist
      - run: npm ci
        working-directory: tests/e2e
      - name: Run Selenium browser interactions
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          MUIS_URL: http://127.0.0.1:4173
          SHOTS_DIR: ${{ github.workspace }}/tests/e2e/artifacts/browser
        run: |
          python3 -m http.server 4173 --directory src-ui/dist > /tmp/muis-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS "$MUIS_URL/" >/dev/null && break
            sleep 1
          done
          npm test --prefix tests/e2e
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: muis-browser-e2e
          path: tests/e2e/artifacts/browser/

  windows-portable:
    needs: build-ui
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-windows
      - uses: actions/download-artifact@v6
        with:
          name: ui-dist
          path: src-ui/dist
      - run: cargo build --release --locked -p muis-shell -p muis-worker -p muis-notify
      - name: Assemble portable zip
        run: >
          Compress-Archive -Path
          target\release\muis.exe,target\release\muis-worker.exe,target\release\muis-notify.exe
          -DestinationPath muis-portable.zip
      - uses: actions/upload-artifact@v6
        with:
          name: muis-portable
          path: muis-portable.zip
