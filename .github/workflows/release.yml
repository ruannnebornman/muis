name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: Read version and check the tag
        run: |
          set -euo pipefail
          version=$(python3 -c "import json;print(json.load(open('crates/muis-shell/tauri.conf.json'))['version'])")
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "${GITHUB_REF_NAME}" == "v${version}" ]] || {
              echo "tag ${GITHUB_REF_NAME} does not match tauri.conf.json version v${version}" >&2
              exit 1
            }
          fi

  # The Linux tarball is the artifact Veldmuis repackages as veldmuis-muis.
  linux-tarball:
    name: Linux tarball
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential
      - run: npm ci
        working-directory: src-ui
      - run: npm run build
        working-directory: src-ui
      - run: cargo build --release --locked -p muis-shell -p muis-worker -p muis-notify -p muis-agent
      - name: Assemble tarball
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          staging="muis-${VERSION}-x86_64-linux"
          mkdir -p "${staging}/icons"
          cp target/release/muis target/release/muis-worker target/release/muis-notify target/release/muis-agent "${staging}/"
          cp data/muis.desktop "${staging}/"
          cp data/icons/hicolor/512x512/apps/muis.png "${staging}/icons/muis.png"
          tar -czf "${staging}.tar.gz" "${staging}"
          sha256sum "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: linux-tarball
          path: |
            muis-*-x86_64-linux.tar.gz
            muis-*-x86_64-linux.tar.gz.sha256

  release:
    name: Publish GitHub Release
    needs: [version, linux-tarball]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Provides MUIS_GPG_PRIVATE_KEY / MUIS_GPG_PASSPHRASE / MUIS_GPG_FPR.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Assemble SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f -name '*.tar.gz' -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Sign release artifacts
        env:
          MUIS_GPG_PRIVATE_KEY: ${{ secrets.MUIS_GPG_PRIVATE_KEY }}
          MUIS_GPG_PASSPHRASE: ${{ secrets.MUIS_GPG_PASSPHRASE }}
          MUIS_GPG_FPR: ${{ secrets.MUIS_GPG_FPR }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/muis-release-key.asc"
          pass_file="${RUNNER_TEMP}/muis-release-passphrase"
          ( umask 077; printf '%s\n' "${MUIS_GPG_PRIVATE_KEY}" > "${key_file}" )
          ( umask 077; printf '%s' "${MUIS_GPG_PASSPHRASE}" > "${pass_file}" )
          cleanup() { rm -f "${key_file}" "${pass_file}"; }
          trap cleanup EXIT

          gpg --batch --import "${key_file}"

          shopt -s nullglob
          artifacts=(dist/*.tar.gz dist/SHA256SUMS)
          for artifact in "${artifacts[@]}"; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase-file "${pass_file}" \
              --local-user "${MUIS_GPG_FPR}" \
              --armor --detach-sign "${artifact}"
            echo "signed ${artifact}.asc"
          done
      - name: Verify signatures
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(dist/*.tar.gz dist/SHA256SUMS)
          for artifact in "${artifacts[@]}"; do
            gpgv --keyring packaging/keys/muis-release.gpg "${artifact}.asc" "${artifact}"
          done
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz \
            dist/SHA256SUMS dist/*.asc packaging/keys/muis-release.asc \
            --title "muis ${GITHUB_REF_NAME}" --generate-notes
