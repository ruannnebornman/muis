name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: Read version and check the tag
        run: |
          set -euo pipefail
          version=$(python3 -c "import json;print(json.load(open('crates/muis-shell/tauri.conf.json'))['version'])")
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "${GITHUB_REF_NAME}" == "v${version}" ]] || {
              echo "tag ${GITHUB_REF_NAME} does not match tauri.conf.json version v${version}" >&2
              exit 1
            }
          fi

  linux-tarball:
    name: Linux tarball
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential
      - run: npm ci
        working-directory: src-ui
      - run: npm run build
        working-directory: src-ui
      - run: cargo build --release --locked -p muis-shell -p muis-worker -p muis-notify
      - name: Assemble tarball
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          staging="muis-${VERSION}-x86_64-linux"
          mkdir -p "${staging}/icons"
          cp target/release/muis target/release/muis-worker target/release/muis-notify "${staging}/"
          cp data/muis.desktop "${staging}/"
          cp data/icons/hicolor/512x512/apps/muis.png "${staging}/icons/muis.png"
          tar -czf "${staging}.tar.gz" "${staging}"
          sha256sum "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: linux-tarball
          path: |
            muis-*-x86_64-linux.tar.gz
            muis-*-x86_64-linux.tar.gz.sha256

  appimage:
    name: AppImage
    needs: version
    # Ubuntu 22.04 baseline keeps the glibc floor low for broad compatibility.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - name: Install Tauri and AppImage deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential librsvg2-dev file patchelf
      - run: npm ci
        working-directory: src-ui
      - run: npm run build
        working-directory: src-ui
      - run: cargo build --release --locked -p muis-worker -p muis-notify
      - name: Build the AppImage
        working-directory: crates/muis-shell
        run: ../../src-ui/node_modules/.bin/tauri build --bundles appimage
      - name: Checksum
        run: |
          cd target/release/bundle/appimage
          sha256sum muis_*.AppImage > SHA256SUMS.appimage
      - uses: actions/upload-artifact@v6
        with:
          name: appimage
          path: |
            target/release/bundle/appimage/muis_*.AppImage
            target/release/bundle/appimage/SHA256SUMS.appimage

  windows:
    name: Windows portable
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - run: npm ci
        working-directory: src-ui
      - run: npm run build
        working-directory: src-ui
      - run: cargo build --release --locked -p muis-shell -p muis-worker -p muis-notify
      - name: Assemble portable zip
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: pwsh
        run: |
          $zip = "muis-portable-$env:VERSION.zip"
          Compress-Archive -Path target\release\muis.exe,target\release\muis-worker.exe,target\release\muis-notify.exe -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  " + $zip | Out-File -Encoding ascii "$zip.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: windows-portable
          path: |
            muis-portable-*.zip
            muis-portable-*.zip.sha256

  flatpak:
    name: Flatpak
    needs: version
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: muis.flatpak
          manifest-path: packaging/flatpak/org.veldmuislinux.muis.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Name the bundle
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: mv muis.flatpak "muis-${VERSION}.flatpak"
      - name: Checksum
        run: sha256sum muis-*.flatpak > SHA256SUMS.flatpak
      - uses: actions/upload-artifact@v6
        with:
          name: flatpak
          path: |
            muis-*.flatpak
            SHA256SUMS.flatpak

  release:
    name: Publish GitHub Release
    needs: [version, linux-tarball, appimage, flatpak, windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Provides MUIS_GPG_PRIVATE_KEY / MUIS_GPG_PASSPHRASE / MUIS_GPG_FPR.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Assemble SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.zip' -o -name '*.flatpak' \) -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Sign release artifacts
        env:
          MUIS_GPG_PRIVATE_KEY: ${{ secrets.MUIS_GPG_PRIVATE_KEY }}
          MUIS_GPG_PASSPHRASE: ${{ secrets.MUIS_GPG_PASSPHRASE }}
          MUIS_GPG_FPR: ${{ secrets.MUIS_GPG_FPR }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/muis-release-key.asc"
          pass_file="${RUNNER_TEMP}/muis-release-passphrase"
          ( umask 077; printf '%s\n' "${MUIS_GPG_PRIVATE_KEY}" > "${key_file}" )
          ( umask 077; printf '%s' "${MUIS_GPG_PASSPHRASE}" > "${pass_file}" )
          cleanup() { rm -f "${key_file}" "${pass_file}"; }
          trap cleanup EXIT

          gpg --batch --import "${key_file}"

          shopt -s nullglob
          artifacts=(dist/*.AppImage dist/*.tar.gz dist/*.zip dist/*.flatpak dist/SHA256SUMS)
          for artifact in "${artifacts[@]}"; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase-file "${pass_file}" \
              --local-user "${MUIS_GPG_FPR}" \
              --armor --detach-sign "${artifact}"
            echo "signed ${artifact}.asc"
          done
      - name: Verify signatures
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(dist/*.AppImage dist/*.tar.gz dist/*.zip dist/*.flatpak dist/SHA256SUMS)
          for artifact in "${artifacts[@]}"; do
            gpgv --keyring packaging/keys/muis-release.gpg "${artifact}.asc" "${artifact}"
          done
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.AppImage dist/*.tar.gz dist/*.zip dist/*.flatpak \
            dist/SHA256SUMS dist/*.asc packaging/keys/muis-release.asc \
            --title "muis ${GITHUB_REF_NAME}" --generate-notes
