name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: Read version and check the tag
        run: |
          set -euo pipefail
          version=$(python3 -c "import json;print(json.load(open('crates/muis-shell/tauri.conf.json'))['version'])")
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "${GITHUB_REF_NAME}" == "v${version}" ]] || {
              echo "tag ${GITHUB_REF_NAME} does not match tauri.conf.json version v${version}" >&2
              exit 1
            }
          fi

  linux-tarball:
    name: Linux tarball
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential
      - run: npm ci
        working-directory: src-ui
      - run: npm run build
        working-directory: src-ui
      - run: cargo build --release --locked -p muis-shell -p muis-worker
      - name: Assemble tarball
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          staging="muis-${VERSION}-x86_64-linux"
          mkdir -p "${staging}/icons"
          cp target/release/muis target/release/muis-worker "${staging}/"
          cp data/muis.desktop "${staging}/"
          cp data/icons/hicolor/512x512/apps/muis.png "${staging}/icons/muis.png"
          tar -czf "${staging}.tar.gz" "${staging}"
          sha256sum "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: linux-tarball
          path: |
            muis-*-x86_64-linux.tar.gz
            muis-*-x86_64-linux.tar.gz.sha256

  appimage:
    name: AppImage
    needs: version
    # Ubuntu 22.04 baseline keeps the glibc floor low for broad compatibility.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - name: Install Tauri and AppImage deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential librsvg2-dev file patchelf
      - run: npm ci
        working-directory: src-ui
      - run: npm run build
        working-directory: src-ui
      - run: cargo build --release --locked -p muis-worker
      - name: Build the AppImage
        working-directory: crates/muis-shell
        run: ../../src-ui/node_modules/.bin/tauri build --bundles appimage
      - name: Checksum
        run: |
          cd target/release/bundle/appimage
          sha256sum muis_*.AppImage > SHA256SUMS.appimage
      - uses: actions/upload-artifact@v6
        with:
          name: appimage
          path: |
            target/release/bundle/appimage/muis_*.AppImage
            target/release/bundle/appimage/SHA256SUMS.appimage

  windows:
    name: Windows portable
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - run: npm ci
        working-directory: src-ui
      - run: npm run build
        working-directory: src-ui
      - run: cargo build --release --locked -p muis-shell -p muis-worker
      - name: Assemble portable zip
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: pwsh
        run: |
          $zip = "muis-portable-$env:VERSION.zip"
          Compress-Archive -Path target\release\muis.exe,target\release\muis-worker.exe -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  " + $zip | Out-File -Encoding ascii "$zip.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: windows-portable
          path: |
            muis-portable-*.zip
            muis-portable-*.zip.sha256

  release:
    name: Publish GitHub Release
    needs: [version, linux-tarball, appimage, windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Assemble SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.AppImage dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --title "muis ${GITHUB_REF_NAME}" --generate-notes
