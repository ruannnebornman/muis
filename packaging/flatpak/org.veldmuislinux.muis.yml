app-id: org.veldmuislinux.muis
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: muis

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

finish-args:
  # Windowing
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # A terminal needs the network and the user's files.
  - --share=network
  - --filesystem=home
  # Run the user's real shell on the host (muis-worker uses flatpak-spawn).
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: muis
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      # The flatpak-builder sandbox has no network by default, so cargo
      # cannot reach crates.io. Share the runner network for the build.
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/muis/cargo
    build-commands:
      # The frontend is built outside the sandbox (release.yml "frontend" job)
      # and supplied as src-ui/dist. Running npm here hit an npm 10.8 bug
      # (registry timeout -> incomplete install, "Exit handler never called!"),
      # so no npm runs in the Flatpak build.
      # muis-notify is deliberately not built: the notification socket is
      # sandbox-local and the host shell cannot reach it (docs/packaging-flatpak.md).
      - cargo build --release --locked -p muis-shell -p muis-worker
      - install -Dm755 target/release/muis /app/bin/muis
      - install -Dm755 target/release/muis-worker /app/bin/muis-worker
      - install -Dm644 packaging/flatpak/org.veldmuislinux.muis.desktop
        /app/share/applications/org.veldmuislinux.muis.desktop
      - install -Dm644 data/icons/hicolor/512x512/apps/muis.png
        /app/share/icons/hicolor/512x512/apps/org.veldmuislinux.muis.png
    sources:
      - type: dir
        path: ../..
