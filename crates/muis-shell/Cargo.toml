[package]
name = "muis-shell"
version = "0.1.0"
edition = "2021"
description = "muis native window shell (Tauri 2): Linux WebKitGTK, Windows WebView2"

[[bin]]
name = "muis"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
muis-core = { path = "../muis-core" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
