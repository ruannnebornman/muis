[package]
name = "muis-worker"
version = "0.1.0"
edition = "2021"
description = "muis pty worker: one process per session, JSON-lines stdio IPC"

[[bin]]
name = "muis-worker"
path = "src/main.rs"

[dependencies]
muis-core = { path = "../muis-core" }
portable-pty = "0.9"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["term"] }
